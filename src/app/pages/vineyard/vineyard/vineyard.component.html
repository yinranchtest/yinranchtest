<div class="container lodging-container">
    <h1 class="text-center fw-bold mb-5">Vineyard at Yin Ranch</h1>
    <app-top-images></app-top-images>
    <div class="row g-4 mb-5">
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3" *ngFor="let venue of venues">
            <div class="venue-card rounded overflow-hidden shadow-sm" (click)="clickToShowDetails(venue?.id)">
                <div class="venue-image" [style.backgroundImage]="'url(' + venue.homePage + ')'">
                </div>
            </div>
            <div class="venue-info text-start">
                <h5 class="venue-title mb-1">{{ venue.name }}</h5>
                <p class="venue-capacity mb-0">Capacity: {{ venue.capacity }}</p>
            </div>
        </div>
    </div>
    <app-bottom-images></app-bottom-images>
</div>
