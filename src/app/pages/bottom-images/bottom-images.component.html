<div class="image-scroll-container">
  <button class="scroll-btn prev" (click)="scrollBottomPrev()"><i class="bi bi-chevron-left"></i></button>
  <div class="scrolling-wrapper">
    <div class="scroll-track d-flex">
      <div *ngFor="let img of bottomImages" class="image-card mx-2 text-center">
        <img [src]="img" class="img-fluid rounded" alt="Gallery Image" />
      </div>
      <div *ngFor="let img of bottomImages" class="image-card mx-2 text-center">
        <img [src]="img" class="img-fluid rounded" alt="Gallery Image" />
      </div>
    </div>
  </div>
  <button class="scroll-btn next" (click)="scrollBottomNext()"><i class="bi bi-chevron-right"></i></button>
</div>
