<div class="container lodging-container">
    <h1 class="text-center fw-bold mb-5">Lodging at Yin Ranch</h1>

    <div class="row g-4">
        <div class="col-md-4" *ngFor="let venue of venues">
            <div class="venue-card position-relative rounded overflow-hidden shadow-sm" (click)="clickToShowDetails()">
                <div class="venue-image" [style.backgroundImage]="'url(' + venue.image + ')'">
                    <div class="overlay"></div>
                    <div class="venue-info text-white text-center">
                        <h5 class="venue-title mb-1">{{ venue.name }}</h5>
                        <p class="venue-capacity mb-0">Capacity: {{ venue.capacity }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
