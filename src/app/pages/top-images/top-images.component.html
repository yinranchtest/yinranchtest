<div class="image-scroll-container">
  <button class="scroll-btn prev" (click)="scrollTopPrev()"><i class="bi bi-chevron-left"></i></button>

  <div class="scrolling-wrapper">
    <div class="scroll-track d-flex">
      <div *ngFor="let item of topImages" class="image-card mx-2 text-center">
        <img [src]="item.url" class="img-fluid rounded" alt="Gallery Image" />
        <p class="mt-2 caption-text">{{ item.caption }}</p>
      </div>
      <div *ngFor="let item of topImages" class="image-card mx-2 text-center">
        <img [src]="item.url" class="img-fluid rounded" alt="Gallery Image" />
        <p class="mt-2 caption-text">{{ item.caption }}</p>
      </div>
    </div>
  </div>

  <button class="scroll-btn next" (click)="scrollTopNext()"><i class="bi bi-chevron-right"></i></button>
</div>
